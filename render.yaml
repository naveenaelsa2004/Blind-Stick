services:
  - type: web
    name: smart-blind-stick-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: API_KEY
        value: blind-stick-secret-key-2026
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_DIR
        value: data
      - key: DATABASE_FILE
        value: sensor_readings.db
